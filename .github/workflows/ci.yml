name: CI

on:
  push:
  pull_request:
  schedule:
    # nightly against the latest Claude Code: the mod API is early access and may change between releases
    - cron: "0 4 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Release check
        run: node scripts/check-release.mjs

      - name: Validate
        run: claude plugin validate --strict .

      # No typecheck: Claude Code writes the type declarations it needs only when the plugin loads in an
      # interactive session, never here. It runs locally.

      - name: Test
        run: claude plugin test .
