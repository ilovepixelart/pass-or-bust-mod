name: Release

on:
  push:
    tags:
      - "pass-or-bust--v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release check
        run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: claude plugin validate --strict .

      # No typecheck: Claude Code writes the type declarations it needs only when the plugin loads in an
      # interactive session, never here. It runs locally.

      - name: Test
        run: claude plugin test .

      - name: Build the archive
        # A zip of the tagged tree, for loading with --plugin-url without a marketplace
        run: |
          version="${GITHUB_REF_NAME#pass-or-bust--v}"
          archive="pass-or-bust-${version}.zip"
          git archive --format=zip --prefix=pass-or-bust/ -o "$archive" HEAD
          sha256sum "$archive" | tee "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release.mjs --notes > notes.md
          gh release create "$GITHUB_REF_NAME" --title "pass-or-bust $VERSION" --notes-file notes.md "$ARCHIVE" "$ARCHIVE.sha256"
